{% extends 'index.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Welcome Back</h3>
                
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Username</label>
                        <input type="text" name="username" id="username" class="form-control" placeholder="Enter your username" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
                </form>
                
                <hr class="text-muted my-4">
                
                <div class="text-center">
                    <p class="text-muted mb-2">Don't have an account yet?</p>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="{{ url_for('register_user') }}" class="btn btn-outline-success">Register as Trekker</a>
                        <a href="{{ url_for('register_staff') }}" class="btn btn-outline-info">Apply as Staff</a>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</div>
{% endblock %}
